<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background with squircle safe zone -->
  <rect width="512" height="512" rx="128" fill="url(#emeraldGrad)"/>
  
  <!-- Subtle accent circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4" stroke-dasharray="10 10"/>

  <!-- Wallet/Rupee Graphic -->
  <g filter="url(#shadow)" transform="translate(136, 120)">
    <!-- Base Coin / Emblem -->
    <rect x="0" y="20" width="240" height="230" rx="36" fill="#10b981" opacity="0.9"/>
    <rect x="8" y="28" width="224" height="214" rx="30" fill="#ffffff" opacity="0.15"/>
    
    <!-- Indian Rupee Symbol (₹) -->
    <text x="120" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle">₹</text>

    <!-- Upward Trend Badge -->
    <circle cx="205" cy="40" r="32" fill="#34d399"/>
    <path d="M192 48 L218 28 M204 28 L218 28 L218 42" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
